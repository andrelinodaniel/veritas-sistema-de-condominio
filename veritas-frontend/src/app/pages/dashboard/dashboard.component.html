<h1 class="font">Painel do Síndico</h1>
<p class="font">Gestão do seu condomínio, num só lugar.</p>

<section class="cartao-acesso">
  <h2>Ações Rápidas</h2>
  <p>Escolha uma função para gerenciar o condomínio.</p>

  <div class="opcoes-perfil">
    <button class="card-perfil card-painel" type="button" routerLink="/chamados">
      <strong>Gerenciar chamados</strong>
      <span>Resolva, exclua e veja o histórico de chamados.</span>
    </button>

    <button class="card-perfil card-painel" type="button" routerLink="/moradores">
      <strong>Cadastro de moradores</strong>
      <span>Cadastre e consulte os moradores do condomínio.</span>
    </button>
  </div>
  
  <button class="botao-voltar" routerLink="/login">
    Sair do app
  </button>
</section>

<!-- Mantendo o Gráfico que foi pedido -->
<section class="cartao-acesso" style="margin-top: 1rem;">
  <h2>Estatísticas</h2>
  <p>Total de moradores: {{ estatisticas?.total_moradores || '-' }}</p>
  
  <div style="width: 100%; height: 300px; display: flex; justify-content: center; align-items: center;">
    <app-chart-chamados [dados]="estatisticas"></app-chart-chamados>
  </div>
</section>
