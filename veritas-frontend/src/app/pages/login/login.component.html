<div class="login-page">

  <div style="text-align: center; margin-bottom: 24px;">
    <img src="/logo.png" alt="Veritas - Gestão de Condomínio" style="max-width: 280px; height: auto;">
  </div>

  <section class="login-container">
    
    <!-- Abas de Perfil -->
    <div class="abas-perfil">
      <button 
        class="aba" 
        [class.aba-ativa]="perfilSelecionado === 'morador'" 
        (click)="selecionarPerfil('morador')">
        Sou Morador
      </button>
      <button 
        class="aba" 
        [class.aba-ativa]="perfilSelecionado === 'sindico'" 
        (click)="selecionarPerfil('sindico')">
        Sou Síndico
      </button>
    </div>

    <div class="campo-login" style="margin-top: 16px;">
      <label for="identificador">CPF</label>
      <input
        id="identificador"
        #identificadorInput
        type="text"
        autocomplete="username"
        placeholder="000.000.000-00"
        required>
    </div>

    <div class="campo-login">
      <label for="senha">Senha</label>
      <input
        id="senha"
        #senhaInput
        type="password"
        autocomplete="current-password"
        placeholder="********"
        required>
    </div>

    <button
      class="botao-entrar"
      (click)="fazerLogin(identificadorInput.value, senhaInput.value)">
      Entrar
    </button>
    
    @if (perfilSelecionado === 'morador') {
      <span class="dourado" routerLink="/cadastro" style="display: block; margin-top: 16px; text-align: center;">
        Ainda não tem conta? Cadastrar-se
      </span>
    }

    @if (erroLogin !== '') {
      <p class="mensagem-erro">{{ erroLogin }}</p>
    }
  </section>

</div>
